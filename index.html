<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多开心的个人小站</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

    :root {
      --ink: #1c1c1c;
      --ink-soft: #4a4a4a;
      --paper: #f4efe4;
      --cinnabar: #a8322d;
      --gold: #c9a961;
      --jade: #5a7a6a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.006) 0px,
          rgba(0,0,0,0.006) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at 15% 20%, rgba(168,50,45,0.025) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(90,122,106,0.035) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(201,169,97,0.02) 0%, transparent 50%),
        radial-gradient(circle at 30% 80%, rgba(0,0,0,0.012) 0%, transparent 30%),
        radial-gradient(circle at 70% 30%, rgba(0,0,0,0.015) 0%, transparent 30%);
      color: var(--ink);
      font-family: "Songti SC", "SimSun", "STSong", serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 2;
    }
    body::before {
      top: 2.2rem; left: 2.2rem; right: 2.2rem; bottom: 2.2rem;
      border: 1px solid rgba(201,169,97,0.40);
      box-shadow: inset 0 0 60px rgba(201,169,97,0.05);
    }
    body::after {
      top: 2.7rem; left: 2.7rem; right: 2.7rem; bottom: 2.7rem;
      border: 1px solid rgba(201,169,97,0.18);
    }

    .glow {
      position: fixed;
      left: -999px; top: -999px;
      width: 80px; height: 80px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle,
          rgba(201,169,97,0.22) 0%,
          rgba(201,169,97,0.08) 30%,
          transparent 60%),
        radial-gradient(circle,
          rgba(168,50,45,0.05) 0%,
          transparent 70%);
      transform: translate(-50%, -50%);
      transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
      mix-blend-mode: multiply;
    }

    .content {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5rem;
      width: 100%;
      max-width: 1200px;
      padding: 0 4rem;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      min-width: 400px;
    }

    .panel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      filter: blur(4px);
      transition:
        opacity 0.7s cubic-bezier(0.22,1,0.36,1),
        transform 0.7s cubic-bezier(0.22,1,0.36,1),
        filter 0.7s cubic-bezier(0.22,1,0.36,1);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel.active {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
      filter: blur(0);
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-title {
      writing-mode: vertical-rl;
      font-size: 3.8rem;
      letter-spacing: 0.45em;
      color: var(--ink);
      font-family: "Ma Shan Zheng", "Songti SC", serif;
      background: linear-gradient(to bottom,
        #333 0%,
        #0d0d0d 25%,
        #1c1c1c 55%,
        #0d0d0d 85%,
        #3a3a3a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 1px 2px rgba(0,0,0,0.10))
        drop-shadow(0 0 12px rgba(201,169,97,0.12));
    }

    /* ===== 印章：改隶书 ===== */
    .seal {
      display: inline-block;
      background-color: var(--cinnabar);
      color: var(--paper);
      font-size: 0.9rem;                              /* 稍微调大，隶书字宽 */
      padding: 0.5em 0.4em;
      border-radius: 3px;
      writing-mode: vertical-rl;
      letter-spacing: 0.15em;
      margin-left: 0.6rem;
      transform: rotate(-6deg);
      font-family: "LiSu", "STLiti", "隶书", serif;    /* ← 新增 */
      box-shadow:
        0 1px 3px rgba(168,50,45,0.18),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .panel-inner { width: 480px; max-width: 100%; }

    .panel-title {
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      margin-bottom: 1.5rem;
      padding-left: 1rem;
      border-left: 3px solid var(--cinnabar);
      line-height: 1.2;
    }

    .panel-text {
      font-size: 1rem;
      color: var(--ink-soft);
      line-height: 2;
      margin-bottom: 1.2rem;
    }

    .placeholder {
      font-size: 0.9rem;
      color: rgba(74,74,74,0.5);
      font-style: italic;
      letter-spacing: 0.1em;
      padding: 2rem 0;
    }

    .nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2.6rem;
    }

    .nav a {
      writing-mode: vertical-rl;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 0.35em;
      position: relative;
      transition: color 0.5s cubic-bezier(0.22,1,0.36,1),
                  letter-spacing 0.5s cubic-bezier(0.22,1,0.36,1),
                  text-shadow 0.5s cubic-bezier(0.22,1,0.36,1);
      cursor: pointer;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--cinnabar);
      letter-spacing: 0.5em;
      text-shadow: 0 0 12px rgba(168,50,45,0.25);
    }

    .nav a::after {
      content: "";
      position: absolute;
      top: 50%; right: -10px;
      width: 1px; height: 0;
      background: linear-gradient(to bottom,
        transparent,
        var(--gold) 30%,
        var(--gold) 70%,
        transparent);
      transition: height 0.5s cubic-bezier(0.22,1,0.36,1);
      transform: translateY(-50%);
    }

    .nav a:hover::after,
    .nav a.active::after {
      height: 100%;
    }

    .back {
      writing-mode: vertical-rl;
      color: var(--cinnabar);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 0.35em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      margin-left: 1.5rem;
      padding-left: 1.5rem;
      border-left: 1px solid rgba(201,169,97,0.5);
      transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1),
                  letter-spacing 0.5s cubic-bezier(0.22,1,0.36,1),
                  text-shadow 0.5s cubic-bezier(0.22,1,0.36,1);
      position: relative;
    }

    .back.show {
      opacity: 1;
      pointer-events: auto;
    }

    .back:hover {
      letter-spacing: 0.5em;
      text-shadow: 0 0 12px rgba(168,50,45,0.25);
    }

    .back::after {
      content: "";
      position: absolute;
      top: 50%; right: -10px;
      width: 1px; height: 0;
      background: linear-gradient(to bottom,
        transparent,
        var(--gold) 30%,
        var(--gold) 70%,
        transparent);
      transition: height 0.5s cubic-bezier(0.22,1,0.36,1);
      transform: translateY(-50%);
    }

    .back:hover::after {
      height: 100%;
    }

    @keyframes inkFadeIn {
      from { opacity: 0; transform: translateY(22px); filter: blur(3px); }
      to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
    }
    @keyframes inkFadeInSeal {
      from { opacity: 0; transform: translateY(22px) rotate(-6deg) scale(0.9); }
      to   { opacity: 1; transform: translateY(0)   rotate(-6deg) scale(1); }
    }

    .site-title { animation: inkFadeIn 1.8s cubic-bezier(0.22,1,0.36,1) both; }
    .seal       { animation: inkFadeInSeal 1.8s cubic-bezier(0.22,1,0.36,1) 0.7s both; }
    .nav a      { animation: inkFadeIn 1.8s cubic-bezier(0.22,1,0.36,1) 1.1s both; }

    ::-webkit-scrollbar { width: 0; height: 0; }
    html { scrollbar-width: none; }

    @media (max-width: 768px) {
      body::before { top: 1rem; left: 1rem; right: 1rem; bottom: 1rem; }
      body::after { top: 1.3rem; left: 1.3rem; right: 1.3rem; bottom: 1.3rem; }
      .content { flex-direction: column; gap: 2.5rem; padding: 2rem; }
      .nav { gap: 1.5rem; }
      .site-title { font-size: 2.5rem; }
      .panel-inner { width: 100%; }
      .stage { min-width: 0; width: 100%; }
      .glow { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="content">

    <div class="stage">

      <div class="panel active" data-panel="home">
        <div class="brand">
          <h1 class="site-title">墨韵</h1>
          <span class="seal">个人小站</span>
        </div>
      </div>

      <div class="panel" data-panel="about">
        <div class="panel-inner">
          <h2 class="panel-title">关于</h2>
          <p class="panel-text">这里是<strong>多开心</strong>的个人网站</p>
        </div>
      </div>

      <div class="panel" data-panel="works">
        <div class="panel-inner">
          <h2 class="panel-title">作品</h2>
          <p class="placeholder">敬请期待</p>
        </div>
      </div>

      <div class="panel" data-panel="contact">
        <div class="panel-inner">
          <h2 class="panel-title">联系</h2>
          <p class="panel-text">8484*****@qq.com</p>
        </div>
      </div>

    </div>

    <nav class="nav">
      <a data-target="about">关于</a>
      <a data-target="works">作品</a>
      <a data-target="contact">联系</a>
      <a class="back" id="back">返回</a>
    </nav>

  </div>

  <script>
    const glow = document.querySelector('.glow');
    document.addEventListener('mousemove', (e) => {
      glow.style.left = e.clientX + 'px';
      glow.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseleave', () => {
      glow.style.left = '-999px';
      glow.style.top  = '-999px';
    });

    const navLinks = document.querySelectorAll('.nav a[data-target]');
    const panels = document.querySelectorAll('.panel');
    const backBtn = document.getElementById('back');

    function showPanel(key) {
      panels.forEach((p) => {
        p.classList.toggle('active', p.dataset.panel === key);
      });
      backBtn.classList.toggle('show', key !== 'home');
    }

    navLinks.forEach((link) => {
      link.addEventListener('click', () => {
        const target = link.dataset.target;
        if (link.classList.contains('active')) return;
        navLinks.forEach((l) => l.classList.remove('active'));
        link.classList.add('active');
        showPanel(target);
      });
    });

    backBtn.addEventListener('click', () => {
      navLinks.forEach((l) => l.classList.remove('active'));
      showPanel('home');
    });

    document.querySelector('.stage').addEventListener('click', (e) => {
      if (e.target.classList.contains('stage')) {
        navLinks.forEach((l) => l.classList.remove('active'));
        showPanel('home');
      }
    });
  </script>

</body>
</html>
